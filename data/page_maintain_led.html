<!DOCTYPE html> <html>
<head>
  <title>Diagon Alley maintain single Led</title>
  <meta name="viewport" content="width=device-width, initial-scale=1", user-scalable=no>
  <link rel="icon" href="/file_favicon.ico">
  <link rel="stylesheet" type="text/css" href="file_style.css">
  <script src="file_jquery-3.7.0.min.js"></script>
  <script>
      var lv_led = 0;
      var lv_anim = 0;
      $(document).ready(function() {
        // url parameters
        $.urlParam = function(name){
          var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
          if (results==null) { return null; }
          return decodeURI(results[1]) || 0;
        }
        lv_led = $.urlParam('led');
        lv_anim = $.urlParam('anim');
        console.log("led="+lv_led + " animnr= "+lv_anim);
        getLedListAnims();    //Animaties ophalen, 
        getValuesJQL();        //dan pas alles ophalen voor jql
			  setonchangeValuesJQL();  //onchange voor jql elementen
			  getValuePrevLed();
        getValueNextLed();
        setTimeout(getImage, 1000);
        getValuesJQH();        //dan pas alles ophalen voor jqh
  		});
      function getValuesJQH() {
        $('p[name="jqh"]').each(function(ind, element) {
			    $(element).val(function(index, value){
            $.get("/showfirmware", {}, function(data) {
      		  //$(element).empty();
              $(element).append(data);
			      });
		  	  });
         });
      };
      function getValuesJQL() {
        $('input[name="jql"]').each(function(ind, element) {
			    $(element).val(function(index, value){
			      $.get("ledValueGet", {led: lv_led, anim: lv_anim, veld: $(element).attr('veld')}, function(data) {
				      $(element).val(data);
				    });
				  });
        });
      };
      function setonchangeValuesJQL(){
			  $('input[name="jql"]').each(function(ind, element) {
			    $(element).on("focusout", function(){
				  $.get("/ledValueSet", {led: lv_led, anim: lv_anim, veld: $(element).attr('veld'), waarde: $(element).val()}, function(data) {});
			    });
		    });
      };
      function getImage() {
        console.log("img refreshed " + $('#img').val() )
        $('#file_img').attr( "src",  $('#img').val() );
      };
      function getLedListAnims(){
        $.get("/ledListAnim", {led: lv_led}, function(data) {
  		  var animsList = $("#anim");
			  animsList.empty();
        animsList.append(data);
			  });
      };
		  function getValuePrevLed() {
        var prevLed = parseInt(lv_led) - 1;
        var prevDesc  = null;
        $.get("ledValueGet", {led: prevLed, veld: "50", anim: lv_anim }, function(data){
          document.getElementById("PrevLed").innerHTML = "Naar: " + data;
          document.getElementById("PrevLed").href  = "/page_maintain_led.html?led="+prevLed+"&anim="+lv_anim;
        });
      };
      function getValueNextLed() {
        var nextLed = parseInt(lv_led) + 1;
        var nextDesc  = null;
        $.get("ledValueGet", {led: nextLed, veld: "50", anim: lv_anim }, function(data){
          document.getElementById("NextLed").innerHTML = "Naar: " + data;
          document.getElementById("NextLed").href  = "/page_maintain_led.html?led="+nextLed+"&anim="+lv_anim;
        });
      };
      function fileLedSaveSettings() { $.get("/ledSettingFileSaves"     , {led: lv_led, anim: lv_anim} , function(data) {$("#status").html(data);}); };
      function fileLedLoadSettings() { $.get("/ledSettingFileLoad"    , {led: lv_led, anim: lv_anim} , function(data) {$("#status").html(data);}); getValuesJQL(); };
      function fileLoadAnim()   {
        lv_anim = $('#anim').val();
        $('#57').val(lv_anim);
        $.get("/ledAnimApply"    , {led: lv_led, anim: lv_anim} , function(data) {$("#status").html(data);}); getValuesJQL(); 
      };
  </script>
</head>

<body style="text-align:left;" id="body" >
  <h1>Beheer effecten van leds</h1>
  <div class="row">
    <div class="column3"><a id="PrevLed" href="/" class='button button-center'></a></div>
      <div class="column3"><h3>
    	  <img id="file_img" name='jql' veld='56' src="" onchange="getImage();"></img><br>
			  Image   <input     name='jql' veld='56' type='text' id="img" required/><br>
			  Naam    <input     name='jql' veld='50' type='text'   required/><br>
			  Animatie<input     name='jql' veld='57' type='text'   required/><br>
        Anims   <select id="anim" type="text"><option value="default"></option></select><br>
        <button onclick="fileLoadAnim()" class="button button-center">Reload</button>
	    </h3></div>
    <div class="column3"><a id="NextLed" href="/" class='button button-center'></a></div>
  </div>
  <div class="row">
      <div class="column2">Brighness(4095) <br><input name='jql' veld='51' type='number' min="0" max="4095"/></div>
      <div class="column2">Effect          <br><input name='jql' veld='52' type='number' min="10" max="13" /><br>10: aan; 11:fire, 12: glow, 13: uit</div>
  </div>
  <div class="row">
      <div class="column3">Time on    <br><input name='jql' veld='53' type='number' min="0" max="255"/><br></div>
      <div class="column3">Time off   <br><input name='jql' veld='54' type='number' min="0" max="255"/></div>
      <div class="column3">Time effect<br><input name='jql' veld='55' type='number' min="0" max="255"/></div>
  </div>
  <p id="status"></p>
  <button onclick="fileLedSaveSettings();"    class="button button-right button-large">Save settings</button>
  <button onclick="fileLedLoadSettings();"   class="button button-right button-large">Load from last save</button>
  <a href="/page_root.html" class="button button-right button-large">Terug naar hoofdscherm</a>
  <p name='jqh'>Firmware status: </p>
</body>
</html>

<!DOCTYPE html> <html>
<head>
<title>rgb</title>
<meta name="viewport" content="width=device-width, initial-scale=1", user-scalable=no>
<link rel="icon" href="/file_favicon.ico">
<link rel="stylesheet" type="text/css" href="file_style.css">
<script src="file_jquery-4.0.0.min.js"></script>
<script>
  var lv_anim = 1;
  var lv_rgb = 0;
  $(document).ready(function() {
    // url parameters
    $.urlParam = function(name){
      var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
      if (results==null) { return null; }
      return decodeURI(results[1]) || 0;
    }
    lv_rgb = $.urlParam('rgb');
    lv_anim = $.urlParam('anim');
    if (lv_anim == null || lv_anim == "") { lv_anim = "0"; }

    console.log("rgb="+lv_rgb + " animnr= "+lv_anim);
    getHuisListAnim();    //Animaties ophalen, 
    getValuesJQR();        //dan pas alles ophalen voor jqr
    setTimeout(getImage, 1000);
    getValuesJQH();        //dan pas alles ophalen voor jqh
  });
  function getHuisListAnim(){
    $.get("/huisListAnim", {}, function(data) {
    let animsList = $("#anim");
    animsList.empty();
    animsList.append(data);
    $('#anim').val(lv_anim);   // zet de animatie volgens url
	  });
  };
  function huisAnimApply() {
    lv_anim = $('#anim').val();
    console.log("huisAnimApply animnr= "+lv_anim);
    window.location.assign("/page_maintain_rgb.html?rgb="+lv_rgb+"&anim="+lv_anim);
  };
  function rgbCopyFirstToAnim() {
    $.get("/rgbCopyFirstToAnim", {rgb: lv_rgb, anim: lv_anim}, function(data) {
      $("#status").html(data);
      huisAnimApply();  //reload de pagina met de nieuwe animatie
    });
  };
  function getValuesJQH() {
    $('p[name="jqh"]').each(function(ind, element) {
      $(element).val(function(index, value){
        $.get("/showfirmware", {}, function(data) {
        $(element).append(data);
		    });
	  	});
    });
  };
  function getValuesJQR() {
    // input initialiseren en onchange zetten
    $('input[name="jqr"]').each(function(ind, element) {
		  $(element).empty();			    //nodig, anders krijgen we meerdere calls
      $(element).val(function(index, value){
		    $.get("rgbValueGet", {rgb: lv_rgb, anim: lv_anim, veld: $(element).attr('veld')}, function(data) {
		      $(element).val(data);
				});
		  });
      $(element).on("focusout", function(){
   	    $.get("/rgbValueSet", {rgb: lv_rgb, anim: lv_anim, veld: $(element).attr('veld'), waarde: $(element).val()}, function(data) {});
      });
    });
    // knoppen initialiseren en onclick zetten
    $('a[name="jqr"]').each(function(ind, element) {
      $(element).val(function(index, value){
        let lv_rgboff = parseInt(lv_rgb) + parseInt( $(element).attr('offset') );
        if (lv_rgboff < 0) { lv_rgboff = 15; }
        if (lv_rgboff > 15) { lv_rgboff = 0; }
        let lv_rgboffStr = String(lv_rgboff);
        $.get("rgbValueGet", {rgb: lv_rgboffStr, anim: lv_anim, veld: $(element).attr('veld')}, function(data) {
          $(element).text(lv_rgboffStr + ". " + data);
          $(element).attr("href", "/page_maintain_rgb.html?rgb="+lv_rgboffStr+"&anim="+lv_anim);
        });
      });
    });
  };
  function getImage() {$('#file_img').attr( "src",  $('#img').val() );};
  function fileRgbSaveSettings() { $.get("/rgbSettingFileSave", {rgb: lv_rgb, anim: lv_anim} , function(data) {$("#status").html(data);}); };
  function fileRgbLoadSettings() { $.get("/rgbSettingFileLoad", {rgb: lv_rgb, anim: lv_anim} , function(data) {$("#status").html(data);}); getValuesJQR(); };
</script>
</head>

<body style="text-align:left;" id="body" >

  <a href="/page_root.html" class="button button-right button-large">Terug naar hoofdscherm</a>
  <p name='jqh'>Firmware status: </p>

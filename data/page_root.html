<!DOCTYPE html><html>
<head>
  <title>Huis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1", user-scalable=no>
  <link rel="icon" href="file_favicon.ico">
  <link rel="stylesheet" type="text/css" href="file_style.css">
  <script src="file_jquery-3.7.0.min.js"></script>
  <script>
    $(document).ready(function() {
      ListLedDefaults();
      ListRgbDefaults();
      getValuesJQH();        //dan pas alles ophalen voor jqh
      getValuesJQL();
      getValuesJQR();
			setonchangeValuesJQH();  //onchange voor jq elementen
      setTimeout(getImage, 1000);
		});
    function getValuesJQH() {
      $('input[name="jqh"]').each(function(ind, element) {
		  	$(element).val(function(index, value){
          lv_led = $(element).attr('led');
          lv_rgb = $(element).attr('rgb');
          lv_veld = $(element).attr('veld');
  		    $.get("huisValueGet", {led: $(element).attr('led'), rgb: $(element).attr('rgb'), veld: $(element).attr('veld')}, function(data) {
	  	      $(element).val(data);
			    });
			  });
      });
      $('p[name="jqh"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          $.get("/showfirmware", {}, function(data) {
      		  //$(element).empty();
            $(element).append(data);
			    });
			  });
       });
    };
    function setonchangeValuesJQH(anim){
		  $('input[name="jqh"]').each(function(ind, element) {
			  $(element).on("focusout", function(){
          lv_led = $(element).attr('led');
          lv_veld = $(element).attr('veld');
          lv_waarde = $(element).val();
  				$.get("/huisValueSet", {led: lv_led, veld: lv_veld, waarde: lv_waarde}, function(data) {});
			  });
		  });
    };
    function getValuesJQL() {
      $('label[name="jql"]').each(function(ind, element) {
		   $(element).val(function(index, value){
          lv_led = $(element).attr('led');
          lv_anim = $(element).attr('anim');
          lv_veld = $(element).attr('veld');
		      $.get("ledValueGet", {led: lv_led, anim: lv_anim, veld: lv_veld}, function(data) {
				    $(element).text(lv_led + ". "+data);
				  });
				});
      });
      $('a[name="jql"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_led = $(element).attr('led');
          lv_anim = $(element).attr('anim');
          lv_veld = $(element).attr('veld');
			    $.get("ledValueGet", {led: lv_led, anim: lv_anim, veld: lv_veld}, function(data) {
            lv_led = $(element).attr('led');
            lv_anim = 0;
            $(element).text(lv_led + ". "+data);
            $(element).attr("href", "/page_maintain_led.html?led="+lv_led+"&anim="+lv_anim);
			    });
			  });
       });
       $('select[name="jql"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_led = $(element).attr('led');
          $.get("/huisListAnim", {led: lv_led}, function(data) {
      		  $(element).empty();
            $(element).append(data);
			    });
			  });
       });
    };
    function getValuesJQR() {
      $('label[name="jqr"]').each(function(ind, element) {
		   $(element).val(function(index, value){
          lv_rgb = $(element).attr('rgb');
          lv_anim = $(element).attr('anim');
          lv_veld = $(element).attr('veld');
		      $.get("rgbValueGet", {rgb: lv_rgb, anim: lv_anim, veld: lv_veld}, function(data) {
				    $(element).text(lv_rgb + ". "+data);
				  });
				});
      });
      $('a[name="jqr"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_rgb = $(element).attr('rgb');
          lv_anim = $(element).attr('anim');
          lv_veld = $(element).attr('veld');
			    $.get("rgbValueGet", {rgb: lv_rgb, anim: lv_anim, veld: lv_veld}, function(data) {
            lv_rgb = $(element).attr('rgb');
            lv_anim = 0;
            $(element).text(lv_rgb + ". "+data);
            $(element).attr("href", "/page_maintain_rgb.html?rgb="+lv_rgb+"&anim="+lv_anim);
			    });
			  });
       });
       $('select[name="jqr"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_rgb = $(element).attr('rgb');
          $.get("/huisListAnim", {rgb: lv_rgb}, function(data) {
      		  $(element).empty();
            $(element).append(data);
			    });
			  });
       });
    };
    function getImage() {
      console.log("img refreshed " + $('#img').val() )
      $('#file_img').attr( "src",  $('#img').val() );
    };
    function ListLedDefaults(){
      for (let i=0; i<16; i++){
        var ledlist = $("<div class='row'>"
                      + "<div class='column3'><a      name='jql' veld='50' led='"+i+"' anim='0' href='/'' class='button button-left'>naar</a></div>"
                      + "<div class='column3'><select name='jql'           led='"+i+"' list='ledanim' type='text' ><option value='default'></option></select></div>"
                      + "<div class='column3'><input  name='jqh' veld='43' led='"+i+"' class='input-small'></input></div>"
                      + "</div>"
                    );
        ledlist.appendTo("#ListLed");
      };
    };
    function ListRgbDefaults(){
      for (let i=0; i<16; i++){
        var ledlist = $("<div class='row'>"
                      + "<div class='column3'><a      name='jqr' veld='1'  rgb='"+i+"' anim='0' href='/'' class='button button-left'>naar</a></div>"
                      + "<div class='column3'><select name='jqr'           rgb='"+i+"' list='rgbanim' type='text' ><option value='default'></option></select></div>"
                      + "<div class='column3'><input  name='jqh' veld='44' rgb='"+i+"' class='input-small'></input></div>"
                      + "</div>"
                    );
        ledlist.appendTo("#ListRgb");
      };
    };
    function fileHuisSaveSettings() { $.get("/huisSettingFileSave", {} , function(data) {$("#status").html(data);}); };
    function fileHuisLoadSettings() { $.get("/huisSettingFileLoad", {lv_anim} , function(data) {$("#status").html(data);}); getValuesJQH(); getValuesJQL(); };
  </script>

</head>
<body>
  <noscript>
    <strong>We're sorry but Diagon Alley doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <h1>Beheer Huis</h1>
  <div class="row">
    <div class="column3">
      <a href="/page_fileManagement.html" class="button button-right  button-large">File management</a>
      <a href="/webserial"                class="button button-right  button-large">Webserial</a>
      <a href="/page_wificfg.html"        class="button button-right  button-large">Wifi config</a>
    </div>
    <div class="column3"><h3>
      <img id="file_img"  src="" onchange="getImage();"></img><br>
      Image<input id="img" veld='41' name='jqh' type='text' led="0"  required/><br>
      Naam<input veld='40' name='jqh' type='text'  led="0" required/><br>
      HuisNr<input class = "input-small" veld='42' name='jqh' type='text' led="0"  required/><br>
      Animatie<br>
      </h3></div>
    <div class="column3">
      <a href="/restart"                  class="button button-right  button-large">/!\Reboot ESP32</a>
      <a href="/update"                   class="button button-right  button-large">Firmware Update</a>
    </div>
  </div>
  <div class="row"><h2>
    <div class="column3"><label>Led</label></div>
    <div class="column3"><label>Animaties</label></div>
    <div class="column3"><label>Default animatie</label></div>
  </h2></div>
  <div id="ListLed"></div>
  <div class="row"><h2>
    <div class="column2"><button onclick="fileHuisSaveSettings();" class="button button-right button-large">Save settings</button></div>
    <div class="column2"><button onclick="fileHuisLoadSettings();" class="button button-right button-large">Load from last save</button></div>
  </div>
  <br>
  <div class="row"><h2>
    <div class="column3"><label>Rgb</label></div>
    <div class="column3"><label>Animaties</label></div>
    <div class="column3"><label>Default animatie</label></div>
  </h2></div>
  <div id="ListRgb"></div>
  
  <p name='jqh'>Firmware status: </p>
</body>
</html>

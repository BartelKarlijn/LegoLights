<!DOCTYPE html><html>
<head>
  <title>Huis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1", user-scalable=no>
  <link rel="icon" href="file_favicon.ico">
  <link rel="stylesheet" type="text/css" href="file_style.css">
  <script src="file_jquery-3.7.0.min.js"></script>
  <script>
    var lv_anim = "1";
    $(document).ready(function() {
      $.urlParam = function(name){  // url parameters
        let results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
        if (results==null) { return null; }
        return decodeURI(results[1]) || 0;
      }
      lv_anim = $.urlParam('anim');
      if (lv_anim == null || lv_anim == "") { lv_anim = "0"; }
      getHuisListAnim();    //Animaties ophalen, 
      getValuesJQH();        //dan pas alles ophalen voor jqh
      ListLedRgbButtons();
      getValuesJQL();
      getValuesJQR();
      setTimeout(getImage, 1000);
		});
    function getHuisListAnim(){
      $.get("/huisListAnim", {}, function(data) {
		  let animsList = $("#anim");
  	  animsList.empty();
      animsList.append(data);
      $('#anim').val(lv_anim);   // zet de animatie volgens url
		  });
    };
    function huisAnimApply() {
      lv_anim = $('#anim').val();
      console.log("huisAnimApply animnr= "+lv_anim);
      $.get("/huisAnimApply", {anim: lv_anim} , function(data) {$("#status").html(data);}); getValuesJQL(); getValuesJQR();
    };
    function ListLedRgbButtons(){
      for (let i=0; i<16; i++){
        var ledlist = $("<div class='row'>"
                      + "<div class='column2'><a name='jql' veld='50' led='"+i+"' anim='"+ lv_anim + "' href='/'' class='button button-left'>naar</a></div>"
                      + "<div class='column3'><a name='jqr' veld='1'  rgb='"+i+"' anim='"+ lv_anim + "' href='/'' class='button button-left'>naar</a></div>"
                      + "</div>"
                    );
        ledlist.appendTo("#ListLedRgb");
      };
    };
    function getValuesJQH() {
      $('input[name="jqh"]').each(function(ind, element) {
		  	$(element).val(function(index, value){  //waardes ophalen
          lv_veld = $(element).attr('veld');
  		    $.get("huisValueGet", {veld: $(element).attr('veld')}, function(data) {
	  	      $(element).val(data);
			    });
        });
			  $(element).on("focusout", function(){  //onchange
          lv_veld = $(element).attr('veld');
          lv_waarde = $(element).val();
  				$.get("/huisValueSet", {veld: lv_veld, anim: lv_anim, waarde: lv_waarde}, function(data) {});
			  });
      });
      $('p[name="jqh"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          $.get("/showfirmware", {}, function(data) {
            $(element).append(data);
			    });
			  });
      });
    };
    function getValuesJQL() {
      $('a[name="jql"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_led = $(element).attr('led');
          lv_veld = $(element).attr('veld');
			    $.get("ledValueGet", {led: lv_led, anim: lv_anim, veld: lv_veld}, function(data) {
            lv_led = $(element).attr('led');
            $(element).text(lv_led + ". "+data);
            $(element).attr("href", "/page_maintain_led.html?led="+lv_led+"&anim="+lv_anim);
			    });
			  });
       });
    };
    function getValuesJQR() {
      $('a[name="jqr"]').each(function(ind, element) {
			  $(element).val(function(index, value){
          lv_rgb = $(element).attr('rgb');
          lv_veld = $(element).attr('veld');
			    $.get("rgbValueGet", {rgb: lv_rgb, anim: lv_anim, veld: lv_veld}, function(data) {
            lv_rgb = $(element).attr('rgb');
            $(element).text(lv_rgb + ". "+data);
            $(element).attr("href", "/page_maintain_rgb.html?rgb="+lv_rgb+"&anim="+lv_anim);
			    });
			  });
       });
    };
    function getImage() {
      console.log("img refreshed " + $('#img').val() )
      $('#file_img').attr( "src",  $('#img').val() );
    };
    function fileHuisSaveSettings() { $.get("/huisSettingFileSave", {} , function(data) {$("#status").html(data);}); };
    function fileHuisLoadSettings() { $.get("/huisSettingFileLoad", {lv_anim} , function(data) {$("#status").html(data);}); getValuesJQH(); getValuesJQL(); getValuesJQH();};
  </script>

</head>
<body>
  <noscript>
    <strong>We're sorry but Diagon Alley doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <h1>Beheer Huis</h1>
  <div class="row">
    <div class="column3">
      <a href="/page_fileManagement.html" class="button button-right  button-large">File management</a>
      <a href="/webserial"                class="button button-right  button-large">Webserial</a>
      <a href="/page_wificfg.html"        class="button button-right  button-large">Wifi config</a>
    </div>
    <div class="column3"><h3>
      <img id="file_img"  src="" onchange="getImage();"></img><br>
      Image<input       veld='41'  name='jqh' type='text' id="img"             required/><br>
      Naam<input        veld='40'  name='jqh' type='text'                      required/><br>
      HuisNr<input      veld='42'  name='jqh' type='text' class="input-small"  required/><br>
      MAC adress<input  veld='48'  name='jqh' type='text'                      required/><br>
      example 22:35:F3:21:ED:00, start with 22<br>
      Animatie<select   id="anim"             type="text" onchange="huisAnimApply()"><option value="default"></option></select><br>
      Rename Anim<input veld='46'  name='jqh' type='text'   required/><br>
      Default Anim<input veld='47' name='jqh' type='text'   required/><br>
      </h3></div>
    <div class="column3">
      <a href="/restart" class="button button-right  button-large">/!\Reboot ESP32</a>
      <a href="/update"  class="button button-right  button-large">Firmware Update</a>
    </div>
  </div>
  <div class="row"><h2>
    <div class="column2"><label>Led</label></div>
    <div class="column2"><label>Rgb</label></div>
  </h2></div>
  <div id="ListLedRgb"></div>
  <div class="row"><h2>
    <div class="column2"><button onclick="fileHuisSaveSettings();" class="button button-right button-large">Save settings</button></div>
    <div class="column2"><button onclick="fileHuisLoadSettings();" class="button button-right button-large">Load from last save</button></div>
  </div>
  
  <p name='jqh'>Firmware status: </p>
</body>
</html>

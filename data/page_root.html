<!DOCTYPE html><html>
<head>
  <title>Diagon Alley</title>
  <meta name="viewport" content="width=device-width, initial-scale=1", user-scalable=no>
  <link rel="icon" href="file_favicon.ico">
  <link rel="stylesheet" type="text/css" href="file_style.css">
  <script src="file_jquery-3.7.0.min.js"></script>
  <script>
    $(document).ready(function() {
      console.log("begin van ready");
      //createDefaultAnim();
      getValuesJQL();
      getValuesJQH();        //dan pas alles ophalen voor jq
			setonchangeValuesJQH();  //onchange voor jq elementen
      setTimeout(getImage, 1000);
		});
    function getValuesJQH() {
        $('input[name="jqh"]').each(function(ind, element) {
			  $(element).val(function(index, value){
			  $.get("huisValueGet", {led: $(element).attr('led'), veld: $(element).attr('veld')}, function(data) {
				  $(element).val(data);
				    });
				  });
        });
      };
      function setonchangeValuesJQH(anim){
			  $('input[name="jqh"]').each(function(ind, element) {
			    $(element).on("focusout", function(){
				  $.get("/huisValueSet", {led: $(element).attr('led'), veld: $(element).attr('veld'), waarde: $(element).val()}, function(data) {});
			    });
		    });
      };
      function getValuesJQL() {
        $('label[name="jql"]').each(function(ind, element) {
			  $(element).val(function(index, value){
			  $.get("ledValueGet", {led: $(element).attr('led'), anim: $(element).attr('anim'), veld: $(element).attr('veld')}, function(data) {
				  $(element).text($(element).attr('led') + ". "+data);
				    });
				  });
        });
        $('a[name="jql"]').each(function(ind, element) {
			    $(element).val(function(index, value){
            lv_led = $(element).attr('led');
            lv_anim = $(element).attr('anim');
            lv_veld = $(element).attr('veld');
			      $.get("ledValueGet", {led: lv_led, anim: lv_anim, veld: lv_veld}, function(data) {
              $(element).text(lv_led + ". "+data);
              $(element).attr("href", "/page_maintain_led.html?led="+lv_led+"&anim="+lv_anim);
				    });
				  });
        });
      };
      function getImage() {
        console.log("img refreshed " + $('#img').val() )
        $('#file_img').attr( "src",  $('#img').val() );
      };
      function getLedListAnims(){
        lv_led = $(element).attr('led');
        $.get("/ledListAnim", {led: lv_led}, function(data) {
  		  var animsList = $("#anim");
			  animsList.empty();
        animsList.append(data);
			  });
      };
      function createDefaultAnim(){
        for (let i=0; i<16; i++){
          var ledlist = $("<input veld='43' led='"+i+"' name='jqh'> default "+ i +"</input>");
          ledlist.appendTo("#defaultAnims"); 
          console.log("led "+i);
        };
    };
  </script>

</head>
<body>
  <noscript>
    <strong>We're sorry but Diagon Alley doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <h1>Beheer Huis</h1>
  <div class="row">
    <div class="column3"><a href="http://192.168.68.191/page_maintain_led.html?led=1&anim=0">led</a></div>
    <div class="column3"><h3>
      <img id="file_img"  src="" onchange="getImage();"></img><br>
      Image<input id="img" veld='41' name='jqh' type='text' led="0"  required/><br>
      Naam<input veld='40' name='jqh' type='text'  led="0" required/><br>
      HuisNr<input class = "input-small" veld='42' name='jqh' type='text' led="0"  required/><br>
      Anims todo <div id='defaultAnims'></div><br>
      </h3></div>
    <div class="column3"><a veld="led"  href="page_maintain_led.html" >rgb</a></div>
  </div>
  <div class="row"><h2>
    <div class="column3"><label>Led</label></div>
    <div class="column3"><label>Default animatie</label></div>
    <div class="column3"><label>Animaties</label></div>
  </h2></div>
  <div class="row">
    <div class="column3"><a      name="jql" veld="50" led="0" anim="0" href="/" class='button button-center'>naar</a></div>
    <div class="column3"><input  name="jqh" veld="43" led="0" class="input-small"></input></div>
    <div class="column3"><select name="jql"           led="0" type="text" ><option value="default"></option></select></div>
  </div>

  <div class="row">
    <div class="column2"><a veld="Flourish"  href="page_huisje.html?image=file_img_Flourish.jpg" ><img src = "file_img_Flourish.jpg" ></a></div>
    <div class="column2"><a veld="Weasley"   href="page_huisje.html?image=file_img_Weasley.jpg"  ><img src = "file_img_Weasley.jpg"  ></a></div>
  </div>

  <a href="/restart"                  class="button button-right  button-large">/!\Reboot ESP32</a>
  <a href="/page_wificfg.html"        class="button button-right  button-large">Wifi config</a>
  <a href="/page_fileManagement.html" class="button button-right  button-large">File management</a>
  <a href="/webserial"                class="button button-right  button-large">Webserial</a>
  <a href="/update"                   class="button button-right  button-large">Firmware Update</a>

  %showfirmware info%
</body>
</html>
